<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#7c3aed"/>
  <!-- Candlestick chart lines -->
  <line x1="8" y1="22" x2="8" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <rect x="5.5" y="13" width="5" height="6" rx="1" fill="#4ade80"/>
  <line x1="16" y1="24" x2="16" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <rect x="13.5" y="10" width="5" height="9" rx="1" fill="#4ade80"/>
  <line x1="24" y1="20" x2="24" y2="12" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <rect x="21.5" y="15" width="5" height="7" rx="1" fill="#f87171"/>
  <!-- Upward trend line -->
  <polyline points="6,21 14,14 22,16" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" fill="none"/>
</svg>
